<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Orkes</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        #main-content {
            display: flex;
        }
        .sidebar {
            width: 200px;
            padding: 20px;
            background-color: #f4f4f4;
            border-right: 1px solid #ddd;
        }
        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar-menu-item {
            margin-bottom: 10px;
        }
        .sidebar-menu-item a {
            text-decoration: none;
            color: #333;
            display: block;
            padding: 10px;
            border-radius: 5px;
        }
        .sidebar-menu-item a.active, .sidebar-menu-item a:hover {
            background-color: #ddd;
        }
        .content {
            flex-grow: 1;
            padding: 20px;
        }
        /* New styles for directory listing */
        #directory_list {
            list-style: none;
            padding: 0;
            margin-top: 10px;
            border: 1px solid #eee;
            max-height: 300px;
            overflow-y: auto;
            background-color: #fff;
        }
        #directory_list li {
            padding: 8px 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }
        #directory_list li:last-child {
            border-bottom: none;
        }
        #directory_list li:hover {
            background-color: #f9f9f9;
        }
        #directory_list li a {
            text-decoration: none;
            color: #555;
            display: block;
        }
        #directory_list li a:hover {
            color: #007bff;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        .message.success {
            background-color: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }
    </style>
</head>
<body>
    <header id="main-header">
        <div class="header-left">
            <a href="/dashboard">
                <img src="/static/logo-sideway.png" alt="Orkes Logo" class="header-logo">
            </a>
        </div>
        <nav class="header-right">
            <div class="main-nav-links">
                <a href="/dashboard" title="Dashboard"><i class="icon fa-solid fa-house"></i> Dashboard</a>
                <a href="/traces" title="Traces"><i class="icon fa-solid fa-route"></i> Traces</a>
                <a href="/settings" title="Settings"><i class="icon fa-solid fa-gear"></i> Settings</a>
            </div>
            <div class="external-links">
                <a href="https://github.com/hfahrudin/orkes" target="_blank" title="GitHub"><i class="icon fa-brands fa-github"></i></a>
                <a href="https://orkes.readthedocs.io/" target="_blank" title="Documentation"><i class="icon fa-solid fa-book"></i></a>
            </div>
        </nav>
    </header>
    <div id="main-content">
        <div class="sidebar">
            <ul class="sidebar-menu">
                <li class="sidebar-menu-item"><a href="#" class="active" onclick="showContent('general')">General</a></li>
                <li class="sidebar-menu-item"><a href="#" onclick="showContent('root')">Root</a></li>
            </ul>
        </div>
        <div class="content">
            <div id="general-content">
                <div class="card">
                    <div class="card-header">
                        General Settings
                    </div>
                    <div class="card-body">
                        <p>General settings content goes here.</p>
                    </div>
                </div>
            </div>
            <div id="root-content" style="display: none;">
                <div class="card">
                    <div class="card-header">
                        <div style="display: inline-block;">
                            Trace Root: <span id="trace-root-value">/home/user</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div>
                            Current Path: <span id="current_path">.</span>
                        </div>
                        <ul id="directory_list">
                            <!-- Directory list will be populated by JavaScript -->
                        </ul>
                        <button id="save_root_folder">Save</button>
                        <div id="message_area" class="message" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let selectedPath = "."; // Initialize with a default value

        function showMessage(msg, type) {
            messageArea.textContent = msg;
            messageArea.className = `message ${type}`;
            messageArea.style.display = 'block';
            setTimeout(() => {
                messageArea.style.display = 'none';
            }, 3000);
        }

        async function showContent(contentType) {
            document.getElementById('general-content').style.display = 'none';
            document.getElementById('root-content').style.display = 'none';
            document.getElementById(contentType + '-content').style.display = 'block';

            document.querySelectorAll('.sidebar-menu-item a').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`.sidebar-menu-item a[onclick="showContent('${contentType}')"]`).classList.add('active');

            if (contentType === 'root') {
                await fetchCurrentRootFolder();
                fetchDirectories(selectedPath);
            }
        }

        async function fetchCurrentRootFolder() {
            try {
                const response = await fetch('/api/settings/root-folder');
                const data = await response.json();
                if (data.root_folder) {
                    selectedPath = data.root_folder;
                    currentPathSpan.textContent = selectedPath;
                }
            } catch (error) {
                console.error("Error fetching current root folder:", error);
                showMessage("Error fetching current root folder.", 'error');
            }
        }

        const directoryList = document.getElementById('directory_list');
        const currentPathSpan = document.getElementById('current_path');
        const saveButton = document.getElementById('save_root_folder');
        const messageArea = document.getElementById('message_area');

        async function fetchDirectories(path) {
            try {
                const response = await fetch(`/api/list-directories?path=${encodeURIComponent(path)}`);
                const data = await response.json();
                if (data.error) {
                    showMessage(data.error, 'error');
                    return;
                }
                
                directoryList.innerHTML = "";
                currentPathSpan.textContent = path;
                selectedPath = path;

                // Add ".." for navigating up
                if (path !== "." && path !== "" && path !== "/") {
                    const parentPath = path.includes('/') ? path.substring(0, path.lastIndexOf('/')) : '.';
                    const upLink = document.createElement('li');
                    upLink.innerHTML = `<a href="#" data-path="${parentPath}"><i class="fa-solid fa-folder"></i> ..</a>`;
                    directoryList.appendChild(upLink);
                }
                
                data.directories.forEach(dir => {
                    const li = document.createElement('li');
                    const displayName = dir.split('/').pop();
                    li.innerHTML = `<a href="#" data-path="${dir}"><i class="fa-solid fa-folder"></i> ${displayName}</a>`;
                    directoryList.appendChild(li);
                });

            } catch (error) {
                console.error("Error fetching directories:", error);
                showMessage("Error fetching directories.", 'error');
            }
        }
        
        directoryList.addEventListener('click', (event) => {
            if (event.target.tagName === 'A' || event.target.closest('a')) {
                event.preventDefault();
                const targetAnchor = event.target.tagName === 'A' ? event.target : event.target.closest('a');
                if (targetAnchor) {
                    const newPath = targetAnchor.getAttribute('data-path');
                    fetchDirectories(newPath);
                }
            }
        });

        saveButton.addEventListener('click', async () => {
            try {
                const response = await fetch('/api/settings/root-folder', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ root_folder: selectedPath })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    showMessage('Root folder saved successfully!', 'success');
                    
                    document.getElementById('trace-root-value').innerText = selectedPath;

                } else {
                    showMessage('Error saving root folder.', 'error');
                }
            } catch (error) {
                console.error('Error saving root folder:', error);
                showMessage('Error saving root folder.', 'error');
            }
        });

        // Initial fetch when the page loads (in case the root tab is the default or first shown)
        // Or, more accurately, when the 'root' tab is made active initially if not default.
        // For now, let's assume showContent('root') will be called when the user navigates.
        // If 'root' is the initial active tab, then call it here:
        // showContent('root'); // Uncomment if 'root' is the initial active tab.
        
        // As per the original structure, general is active initially, so this will be called on click.
        // However, we need to ensure initial selectedPath is correct when "Root" is first displayed.
        // So we will call fetchCurrentRootFolder when the page loads, and then fetchDirectories based on that.
        
        // TODO: NEED TO GET TRACE ROOT FROM BE AND DISPLAY IT AS INITIAL VALUE
        document.addEventListener('DOMContentLoaded', async () => {
            await fetchCurrentRootFolder();
            // Only fetch directories if the root content is displayed, or ensure initial selectedPath is used for first display
            if (document.getElementById('root-content').style.display === 'block') {
                 fetchDirectories(selectedPath);
            }
        });
    </script>
</body>
</html>
