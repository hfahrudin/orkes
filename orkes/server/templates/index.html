<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Orkes</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="/static/favicon.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header id="main-header">
        <div class="header-left">
            <a href="/">
                <img src="/static/logo-sideway.png" alt="Orkes Logo" class="header-logo">
            </a>
        </div>
        <nav class="header-right">
            <div class="main-nav-links">
                <a href="/" title="Dashboard"><i class="icon fa-solid fa-house"></i> Dashboard</a>
                <a href="/traces" title="Traces"><i class="icon fa-solid fa-route"></i> Traces</a>
                <a href="/settings" title="Settings"><i class="icon fa-solid fa-gear"></i> Settings</a>
            </div>
            <div class="external-links">
                <a href="https://github.com/hfahrudin/orkes" target="_blank" title="GitHub"><i class="icon fa-brands fa-github"></i></a>
                <a href="https://orkes.readthedocs.io/" target="_blank" title="Documentation"><i class="icon fa-solid fa-book"></i></a>
            </div>
        </nav>
    </header>
    <div id="main-content"> <!-- main-content now directly under body -->
        <div class="card">
            <div class="card-header">
                Recent Traces
            </div>
            <div class="card-body">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Run ID</th>
                            <th>Graph Name</th>
                            <th>Status</th>
                            <th>Start Time</th>
                            <th>Elapsed</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><code>39ee2204-...</code></td>
                            <td>default_graph</td>
                            <td>FINISHED</td>
                            <td>2025-12-28 14:15:26</td>
                            <td>0m 6s</td>
                        </tr>
                        <tr>
                            <td><code>a1b2c3d4-...</code></td>
                            <td>another_graph</td>
                            <td>RUNNING</td>
                            <td>2026-01-20 10:30:00</td>
                            <td>0m 2s</td>
                        </tr>
                        <tr>
                            <td><code>e5f6g7h8-...</td>
                            <td>test_workflow</td>
                            <td>FAILED</td>
                            <td>2026-01-19 09:00:00</td>
                            <td>0m 10s</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
